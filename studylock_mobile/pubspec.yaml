name: studylock_mobile
description: "StudyLock Mobile - Distraction-free Study & Kiosk Lock Environment for Android"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # In-App Safe Web Engine
  flutter_inappwebview: ^6.0.0

  # PDF Rendering

  # File Picker for Local PDFs
  file_picker: ^8.0.0+1

  # Local Persistence & Encrypted Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  path_provider: ^2.1.2

  # Sound & Haptic Feedback for 15-Minute AFK Pulse
  vibration: ^1.9.0

  # State Management & Localization
  provider: ^6.1.2
  intl: ^0.19.0
  url_launcher: ^6.2.5
  syncfusion_flutter_pdfviewer: 26.2.14

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/app_logo.png
    - assets/icons/app_icon.png
